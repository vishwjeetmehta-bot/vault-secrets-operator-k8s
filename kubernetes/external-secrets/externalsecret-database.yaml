apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payment-database-secret
  namespace: default
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: database/creds/payment-role
        property: username
    - secretKey: password
      remoteRef:
        key: database/creds/payment-role
        property: password

